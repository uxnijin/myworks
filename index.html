<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nijin — Product Designer</title>
  <meta name="description" content="Design engineering, documented. Case studies for the browser extensions, Figma plugins and network tools I design and build.">
  <!-- Root-absolute: the router serves /docs/<slug>, so relative asset paths would break. -->
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" type="image/jpeg" href="/avatar.jpg">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1d1d1d" media="(prefers-color-scheme: dark)">
  <script>
    // Set the theme before first paint so there's no flash.
    (() => {
      try {
        const saved = localStorage.getItem('theme');
        const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
</head>

<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="progress" id="progress"></div>

  <header class="topbar">
    <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar"></button>

    <a class="brand" href="/" data-link>
      <span class="brand-mark" id="brand-mark"></span>
      <span id="brand-name">Nijin</span>
      <span class="brand-sep">/</span>
      <span class="brand-sub">Docs</span>
    </a>

    <span class="topbar-spacer"></span>

    <button class="search-btn" id="search-btn" aria-label="Search projects">
      <span class="sr-only">Search</span>
      <span class="search-ico" aria-hidden="true"></span>
      <span class="search-label">Search projects…</span>
      <kbd id="search-kbd">⌘K</kbd>
    </button>

    <button class="icon-btn theme-btn" id="theme-btn" aria-label="Toggle dark mode"></button>
  </header>

  <div class="scrim" id="scrim"></div>

  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Project navigation">
      <nav id="nav"></nav>
    </aside>

    <main class="content" id="main">
      <div id="view"></div>
    </main>

    <aside class="toc" id="toc" aria-label="On this page"></aside>
  </div>

  <!-- Search palette -->
  <div class="pal-bg" id="pal-bg" role="dialog" aria-modal="true" aria-label="Search projects">
    <div class="pal">
      <div class="pal-in">
        <span id="pal-icon" aria-hidden="true"></span>
        <input type="text" id="pal-input" placeholder="Search projects…" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true" aria-controls="pal-res" aria-autocomplete="list">
      </div>
      <div class="pal-res" id="pal-res" role="listbox" aria-label="Results"></div>
      <div class="pal-foot">
        <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
        <span><kbd>↵</kbd> open</span>
        <span><kbd>esc</kbd> close</span>
      </div>
    </div>
  </div>

  <!-- Lightbox -->
  <div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Image viewer">
    <button class="lb-close" id="lb-close" aria-label="Close"></button>
    <img id="lb-img" src="" alt="">
  </div>

  <div class="gh-tip" id="gh-tip" role="status"></div>

  <script src="/data.js"></script>
  <script src="/blocks.js"></script>
  <script src="/script.js"></script>
</body>

</html>
