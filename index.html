<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Design engineering, documented. Products for the browser extensions, Figma plugins and network tools I design and build.">
  <link rel="canonical" href="https://nijin.site/">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Nijin">
  <meta property="og:title" content="Nijin — Product Designer">
  <meta property="og:description" content="Design engineering, documented. Products for the browser extensions, Figma plugins and network tools I design and build.">
  <meta property="og:url" content="https://nijin.site/">
  <meta property="og:image" content="https://nijin.site/avatar.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Nijin — Product Designer">
  <meta name="twitter:description" content="Design engineering, documented. Products for the browser extensions, Figma plugins and network tools I design and build.">
  <meta name="twitter:image" content="https://nijin.site/avatar.jpg">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Nijin",
    "jobTitle": "Product Designer",
    "url": "https://nijin.site/",
    "image": "https://nijin.site/avatar.jpg",
    "sameAs": [
      "https://instagram.com/uxnijin",
      "https://linkedin.com/in/nijinmuhammed",
      "https://www.youtube.com/@designschoolmalayalam",
      "https://github.com/uxnijin",
      "https://www.figma.com/@uxnijin"
    ]
  }
  </script>

  <!-- Root-absolute: the router serves /docs/<slug>, so relative asset paths would break. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter+Tight:wght@500;600&family=Inter:opsz,wght@14..32,400..600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" type="image/jpeg" href="/avatar.jpg">
  <meta name="theme-color" content="#ffffff">
</head>

<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="progress" id="progress"></div>

  <div class="promo-bar" id="promo-bar"></div>

  <header class="topbar">
    <div class="topbar-in">
      <button class="menu-btn" id="menu-btn" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar"></button>

      <a class="brand" href="/" data-link>
        <span class="brand-mark" id="brand-mark"></span>
        <span class="brand-name" id="brand-name">Nijin</span>
      </a>

      <nav class="topnav" aria-label="Primary">
        <a href="/designs" data-link data-nav="designs">Designs</a>
        <a href="/case-studies" data-link data-nav="case-studies">Case Studies</a>
        <a href="/products" data-link data-nav="products">Products</a>
        <a href="/findings" data-link data-nav="findings">UX Findings</a>
        <!-- hidden for now — the /graphics route still works, just unlinked
        <a href="/graphics" data-link data-nav="graphics">Graphics</a>
        -->
        <a href="/about" data-link data-nav="about">About</a>
      </nav>

      <span class="topbar-spacer"></span>

      <a class="btn btn-dark btn-sm contact-btn" href="/contact" data-link id="contact-btn">Contact</a>
    </div>
  </header>

  <div class="scrim" id="scrim"></div>

  <div class="layout" id="layout">
    <aside class="sidebar" id="sidebar" aria-label="Site navigation">
      <nav id="nav"></nav>
      <div class="sidebar-socials" id="sidebar-socials" aria-label="Social links"></div>
    </aside>

    <main class="content" id="main">
      <div id="view"></div>
    </main>
  </div>

  <footer class="site-foot" id="site-foot"></footer>

  <!-- kept for legacy view code that clears it; nothing renders here any more -->
  <div id="toc" hidden></div>

  <!-- Search palette -->
  <div class="pal-bg" id="pal-bg" role="dialog" aria-modal="true" aria-label="Search the work">
    <div class="pal">
      <div class="pal-in">
        <span id="pal-icon" aria-hidden="true"></span>
        <input type="text" id="pal-input" placeholder="Search the work…" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true" aria-controls="pal-res" aria-autocomplete="list">
      </div>
      <div class="pal-res" id="pal-res" role="listbox" aria-label="Results"></div>
      <div class="pal-foot">
        <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
        <span><kbd>↵</kbd> open</span>
        <span><kbd>esc</kbd> close</span>
      </div>
    </div>
  </div>

  <!-- Lightbox -->
  <div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Image viewer">
    <button class="lb-close" id="lb-close" aria-label="Close"></button>
    <img id="lb-img" src="" alt="">
  </div>

  <div class="gh-tip" id="gh-tip" role="status"></div>

  <!-- The index and the renderer. Every case study, product and finding body
       lives in its own file under /designs, /projects, /findings and is
       fetched when that entry is opened — see the loader in script.js. -->
  <script src="/data.js"></script>
  <script src="/analytics.js"></script>
  <script src="/mesh.js"></script>
  <script src="/blocks.js"></script>
  <script src="/script.js"></script>
</body>

</html>
