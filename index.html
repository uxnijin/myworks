  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1d1d1d" media="(prefers-color-scheme: dark)">
  <script>
    // Set the theme before first paint so there's no flash, and keep it
    // tracking the OS preference live — there's no manual toggle.
    (() => {
      try {
        const query = window.matchMedia('(prefers-color-scheme: dark)');
        let first = true;
        const update = () => {
          // fade the swap instead of snapping, but not on the very first
          // (pre-paint) call — there's nothing to fade from yet.
          if (!first) {
            document.documentElement.classList.add('theme-transitioning');
            setTimeout(() => document.documentElement.classList.remove('theme-transitioning'), 400);
          }
          first = false;
          document.documentElement.dataset.theme = query.matches ? 'dark' : 'light';
        };
        update();
        query.addEventListener('change', update);
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
