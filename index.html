<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nijin — Tools</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="noise"></div>

  <main class="stage">

    <header class="profile">
      <div class="avatar" id="avatar"></div>
      <h1 class="name" id="name"></h1>
      <p class="role" id="role"></p>
      <p class="bio" id="bio"></p>
      <div class="links" id="links"></div>
    </header>

    <div class="search-bar">
      <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2"
        fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="search" placeholder="Search tools..." autocomplete="off">
      <span class="search-shortcut">/</span>
    </div>

    <section class="grid" id="grid"></section>

  </main>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>

</html>
